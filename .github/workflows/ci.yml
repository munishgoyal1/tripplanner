name: Continuous Integration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --all-extras --locked
      - name: Critical lint
        # The established full Ruff policy has legacy style debt. Keep this
        # merge gate focused on errors that can break execution; expand it as
        # the existing backlog is resolved.
        run: uv run ruff check --select E9,F63,F7,F82 src tests
      - name: Suite status
        # The complete pytest suite moved to suite-health.yml, which runs it on
        # every push to master. Announced rather than silently absent: a PR log
        # that simply stopped mentioning tests would read as though they passed.
        run: |
          echo "pytest is NOT run on pull requests."
          echo "It runs on every push to master via the Suite health workflow,"
          echo "classified against scripts/dev/test-health-baseline.json."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Suite status
        run: |
          echo "vitest is NOT run on pull requests."
          echo "It runs on every push to master via the Suite health workflow."
      - name: Production build
        run: npm run build

  mobile:
    name: Mobile type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
