name: Build and Push Image

# MANUAL ONLY. This workflow publishes an image but never deploys it. Releases
# must use the guarded canary and production scripts after the image is built.
# Trigger this from the Actions tab ("Run workflow"), or build locally with:
#   infra/push-image.ps1      (build + push image to GHCR)
#   infra/deploy-canary.ps1   (deploy to canary)
#   infra/deploy-prod.ps1     (deploy to prod, with approval gate)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write    # Push image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tripplanner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build & push image (sha + latest tags)
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image and guarded release path
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Immutable image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo ""
            echo "Deploy with \`./infra/deploy-canary.ps1 -NoBuild -ImageTag ${{ github.sha }}\`."
            echo "Production promotion remains owned by \`./infra/deploy-prod.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"

