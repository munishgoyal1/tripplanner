[project]
name = "tripplanner"
version = "0.2.0"
description = "AI-powered trip planner — flights, hotels, activities with real Amadeus API search"
requires-python = ">=3.11"
# Lower bounds track the tested major line (langchain/langgraph 1.x).
# requirements.lock pins the exact, reproducible set — install with that for
# a known-good env; this list only declares minimum-compatible majors.
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-openai>=1.2",
    "openai>=2.41",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.13",
    "httpx>=0.28",
    "rich>=13.9",
    "azure-cosmos>=4.16",
    "reportlab>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.12",
]
azure = [
    "azure-identity>=1.19",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
